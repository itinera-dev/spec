name: Spec defect
description: Report specification text that is wrong, ambiguous or contradictory.
title: "Spec defect: "
labels: ["spec defect"]
body:
  - type: input
    id: location
    attributes:
      label: Where
      description: The file and section, for example spec/06-hooks-lifecycles-and-roles.md, 6.3.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What the text says, and why it is wrong, ambiguous or contradictory. Quote the text.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
      description: Optional. If the text never addresses the situation, so the correction would add a new rule, it needs a proposal instead.
    validations:
      required: false
